# S011 cloud gates for dataset-v1/candidate-009 (no GPU, no model weights, no secrets).
#   1. Windows calibration validation (stand-in for the established Python 3.15 / pytest 9.2 PC runtime)
#   2. Pinned-tokenizer length profile, calibrated against the committed S007 profile
# Results are uploaded as run artifacts; nothing is committed back to the repository.
name: S011 cloud gates (candidate-009)

on:
  workflow_dispatch:
  push:
    branches: [claude/candidate-009]
    paths:
      - ".github/workflows/s011-cloud-gates.yml"
      - "dataset-v1/candidate-009/**"
      - "studies/S011-error-path-preservation/**"

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.15 (established runtime)
        id: py315
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Fallback Python 3.14 (recorded in the summary note)
        if: steps.py315.outcome != 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pytest 9.2
        run: python -m pip install "pytest==9.2.*"
      - name: Validate candidate-009 (gold vs references and all designated mutants)
        shell: pwsh
        run: >
          python studies/S011-error-path-preservation/validate_candidate_009.py
          --out ci-validation-windows
          --note "GitHub Actions windows-latest runner (python 3.15 setup outcome: ${{ steps.py315.outcome }}); stand-in for the user's PC runtime."
      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s011-windows-validation
          path: ci-validation-windows/

  tokenizer-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tokenizer-only dependencies (versions from lora-feasibility/packages.lock.txt)
        run: python -m pip install "transformers==5.22.1" "tokenizers==0.23.3" "huggingface_hub==2.4.0" "Jinja2==3.1.6"
      - name: Profile candidate-009 with the pinned tokenizer
        run: python studies/S011-error-path-preservation/profile_lengths_cloud_009.py --out ci-token-profile
      - name: Upload token profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s011-token-profile
          path: ci-token-profile/
